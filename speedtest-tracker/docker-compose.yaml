services:
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest-tracker
    environment:
      - PUID=1000
      - PGID=1000
      - DB_CONNECTION=sqlite
      - APP_KEY=${SPEEDTEST_APP_KEY}
      - SPEEDTEST_SCHEDULE=0 * * * *
      - HOMEPAGE_ALLOWED_HOSTS=172.16.175.180:3003, speedtest.local
   # ports:
   #   - "3003:80"
    networks:
      - proxy-net
    volumes:
      - ./config:/config
    restart: unless-stopped
networks:
  proxy-net:
    external: true
